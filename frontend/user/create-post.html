<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - ModSense</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="logo">Mod<span>Sense</span></div>
        <ul class="sidebar-menu">
            <li><a href="community-home.html">Home</a></li>
            <li><a href="explore-community.html">Explore Communities</a></li>
            <li><a href="my-communities.html">My Communities</a></li>
            <li><a href="community-feed.html">Community Feed</a></li>
            <li><a href="create-post.html">Create Post</a></li>
            <li><a href="ai-assistant.html">AI Assistant</a></li>
        </ul>
        <div class="logout-container">
            <a href="../auth/login.html" class="logout-btn">Logout</a>
        </div>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <h1>Create Post</h1>
            <div class="admin-profile">
                <div class="profile-circle">U</div>
                <span class="logged-user-name">User</span>
            </div>
        </header>
        <section class="page">

    <div class="card">
        <h2>Create a Community Post</h2>
        <p class="muted">New posts are automatically analyzed by the AI moderation task.</p>
        <form id="createPostForm">
            <div class="form-group">
                <label>Community</label>
                <select id="communityId" required></select>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input id="postTitle" maxlength="255" required>
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea id="postContent" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Publish Post</button>
        </form>
    </div>

        </section>
    </main>
</div>
</body>
</html>
