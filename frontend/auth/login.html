<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ModSense</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="logo">Mod<span>Sense</span></div>
    <h1>Login</h1>
    <p class="muted">Sign in to continue to the community platform.</p>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
        <p id="formMessage" class="error"></p>
    </form>

    <p>New user? <a href="signup.html" class="auth-link">Create an account</a></p>
</div>
</body>
</html>
