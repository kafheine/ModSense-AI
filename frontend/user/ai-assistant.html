<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - ModSense</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="logo">Mod<span>Sense</span></div>
        <ul class="sidebar-menu">
            <li><a href="community-home.html">Home</a></li>
            <li><a href="explore-community.html">Explore Communities</a></li>
            <li><a href="my-communities.html">My Communities</a></li>
            <li><a href="community-feed.html">Community Feed</a></li>
            <li><a href="create-post.html">Create Post</a></li>
            <li><a href="ai-assistant.html">AI Assistant</a></li>
        </ul>
        <div class="logout-container">
            <a href="../auth/login.html" class="logout-btn">Logout</a>
        </div>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <h1>ModSense AI Assistant</h1>
            <div class="admin-profile">
                <div class="profile-circle">U</div>
                <span class="logged-user-name">User</span>
            </div>
        </header>
        <section class="page">

    <div class="chat-wrapper">
        <div class="page-heading">
            <h2>AI Assistant</h2>
            <p>Ask questions about communities, posts, comments, likes and moderation.</p>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <form id="chatForm" class="chat-form">
            <input id="chatInput" placeholder="Ask ModSense AI..." autocomplete="off" required>
            <button class="btn btn-primary" type="submit">Send</button>
            <button class="btn btn-secondary" id="clearChat" type="button">Clear</button>
        </form>
    </div>

        </section>
    </main>
</div>
</body>
</html>
